
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ee0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Explica+">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="HandheldFriendly" content="true">
    <title>Explica+ | Claro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Roboto', sans-serif; 
          -webkit-tap-highlight-color: transparent;
          overscroll-behavior-y: contain;
        }
        .claro-red { background-color: #ee0000; }
        .claro-text-red { color: #ee0000; }
        .claro-border-red { border-color: #ee0000; }
        .claro-gradient { background: linear-gradient(135deg, #ee0000 0%, #ff4d4d 100%); }
        
        @keyframes scaleUp {
          from { transform: scale(0.95); opacity: 0; }
          to { transform: scale(1); opacity: 1; }
        }
        .animate-scaleUp { animation: scaleUp 0.3s ease-out forwards; }
        
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }

        @keyframes talkPulse {
          0% { transform: scale(1); border-color: #ee0000; }
          50% { transform: scale(1.02); border-color: #ff4d4d; }
          100% { transform: scale(1); border-color: #ee0000; }
        }
        .animate-talk { animation: talkPulse 2s ease-in-out infinite; }

        @keyframes dotTyping {
          0% { opacity: 0.2; transform: translateY(0); }
          50% { opacity: 1; transform: translateY(-5px); }
          100% { opacity: 0.2; transform: translateY(0); }
        }
        .dot-1 { animation: dotTyping 1.4s infinite 0s; }
        .dot-2 { animation: dotTyping 1.4s infinite 0.2s; }
        .dot-3 { animation: dotTyping 1.4s infinite 0.4s; }

        /* Estilização para o espelhamento da câmera */
        .mirror { transform: scaleX(-1); }

        /* Scrollbar customizada para o Admin */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ee0000; border-radius: 10px; }
    </style>
<script type="importmap">

</body>
</html>
